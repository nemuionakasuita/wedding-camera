<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding Photo Booth Premium</title>
    <style>
        :root {
            --primary-pink: #fce4ec;
            --accent-pink: #ff6b9d;
            --admin-bg: #f5f5f5;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
            background-color: #000;
        }

        /* 画面共通設定 */
        .screen {
            position: absolute; width: 100%; height: 100%;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            background-color: white; z-index: 10;
        }

        .active { display: flex !important; }

        /* 横向き警告画面 */
        #landscape-warning {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        #landscape-warning.show { display: flex !important; }
        .rotate-icon { font-size: 8rem; margin-bottom: 30px; animation: rotate-animation 2s ease-in-out infinite; }
        @keyframes rotate-animation { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
        .warning-text { font-size: 2.5rem; font-weight: bold; margin-bottom: 20px; }
        .warning-subtext { font-size: 1.5rem; color: #ccc; }

        /* 1. 管理者画面 */
        #admin-screen { background-color: var(--admin-bg); overflow-y: auto; padding: 40px; }
        .admin-card { background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 600px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
        .admin-info { background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px; padding: 15px; margin: 15px 0; font-size: 14px; color: #856404; }
        
        /* 2. スタート画面 */
        #start-screen { background: #000; }
        #guide-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .start-ui { z-index: 20; text-align: center; color: white; }
        .admin-trigger { position: absolute; bottom: 20px; left: 20px; width: 60px; height: 60px; background: rgba(255, 255, 255, 0.2); border-radius: 50%; z-index: 100; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; color: rgba(255, 255, 255, 0.5); border: 1px solid rgba(255, 255, 255, 0.3); }
        .admin-trigger::after { content: "⚙️"; }

        /* 3. フレーム選択画面 */
        .frame-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 20px; width: 90%; max-height: 60vh; overflow-y: auto; }
        .frame-item { border: 4px solid #eee; border-radius: 10px; cursor: pointer; background: #fff; aspect-ratio: 3/4; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; color: #999; text-align: center; overflow: hidden; }
        .frame-item.selected { border-color: var(--accent-pink); background: #fff0f5; }
        .frame-item img { width: 100%; height: 100%; object-fit: contain; }

        /* 4. 撮影画面 */
        .camera-box { position: relative; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; }
        
        /* カメラビューポート（ここで強制的に3:4の縦長枠を作る） */
        .camera-viewport {
            position: relative;
            width: 85%;
            max-width: 600px;
            aspect-ratio: 3 / 4; /* 強制的に縦長比率に */
            background: #111;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
      #webcam {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* contain から cover に変更 */
    object-fit: cover !important; 
    background: #000;
    transform: scaleX(-1);
}
        #frame-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; z-index: 15; transform: scaleX(-1); }
        #countdown { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 15rem; color: white; z-index: 20; font-weight: bold; text-shadow: 0 0 30px rgba(0,0,0,0.5); }

        /* 共通ボタン */
        .btn { padding: 18px 50px; font-size: 1.6rem; border: none; border-radius: 60px; cursor: pointer; background: var(--accent-pink); color: white; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.2); margin: 10px; transition: transform 0.2s; }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .btn-back { background: #888; font-size: 1.2rem; padding: 12px 30px; }
    </style>
</head>
<body>

    <div id="landscape-warning">
        <div class="rotate-icon">📱</div>
        <div class="warning-text">iPadを縦向きにしてください</div>
        <div class="warning-subtext">Please rotate to portrait mode</div>
    </div>

    <div id="admin-screen" class="screen active">
        <div class="admin-card">
            <h2>⚙️ 管理者設定</h2>
            <div class="admin-info">
                <strong>📐 フレーム画像の推奨仕様</strong><br>
                サイズ: <strong>1080×1440px</strong> (縦長 3:4)<br>
                形式: PNG（透過背景推奨）<br>
                向き: 縦長（iPadと同じ向き）
            </div>
            <input type="file" id="upload-input" multiple accept="image/png,image/jpeg" style="margin:20px 0;">
            <div id="admin-frame-preview" style="display:flex; gap:10px; margin: 20px 0; flex-wrap: wrap; justify-content: center;"></div>
            <button class="btn" onclick="moveToStart()">設定完了 → スタート画面へ</button>
        </div>
    </div>

    <div id="start-screen" class="screen">
        <video id="guide-video" autoplay muted loop playsinline>
            <source src="guide.mp4" type="video/mp4">
        </video>
        <div class="start-ui">
            <h1 style="font-size: 4.5rem; margin-bottom: 30px;">Happy Wedding</h1>
            <button class="btn" onclick="goToFrameSelect()">START</button>
        </div>
        <div class="admin-trigger" onclick="checkPasscode()"></div>
    </div>

    <div id="frame-select-screen" class="screen">
        <h2 style="color: var(--accent-pink); font-size: 2.5rem;">フレームを選んでね</h2>
        <div class="frame-grid" id="frame-grid"></div>
        <div style="margin-top: 30px; display: flex; gap: 20px;">
            <button class="btn btn-back" onclick="showScreen('start-screen')">戻る</button>
            <button class="btn" id="to-shoot-btn" onclick="goToShooting()" disabled>撮影にすすむ</button>
        </div>
    </div>

    <div id="shooting-screen" class="screen">
        <div class="camera-box">
            <button class="btn btn-back" style="position:absolute; top:20px; left:20px; z-index:40;" onclick="backToFrameSelect()">戻る</button>
            <div class="camera-viewport">
                <video id="webcam" autoplay playsinline muted></video>
                <img id="frame-overlay" src="">
                <div id="countdown"></div>
            </div>
        </div>
        <button class="btn" id="shutter-btn" style="position:absolute; bottom:50px; z-index:30;" onclick="startTimer()">撮影！</button>
    </div>

    <div id="preview-screen" class="screen">
        <canvas id="result-canvas" style="width: 85%; max-width: 600px; aspect-ratio: 3/4; object-fit: contain; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);"></canvas>
        <div style="margin-top: 25px;">
            <button class="btn btn-back" onclick="retakePhoto()">撮り直す</button>
            <button class="btn" onclick="printTwoCopies()">印刷する</button>
        </div>
    </div>

    <script>
        const CONFIG = { ADMIN_PASSCODE: "1234" };

        function checkOrientation() {
            const warning = document.getElementById('landscape-warning');
            if (window.innerWidth > window.innerHeight) {
                warning.classList.add('show');
            } else {
                warning.classList.remove('show');
            }
        }
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);
        checkOrientation();

        let frames = [];
        try {
            const saved = localStorage.getItem('wedding_frames');
            frames = saved ? JSON.parse(saved) : [];
        } catch(e) { frames = []; }
        let selectedFrame = null;
        let stream = null;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(id);
            if(target) target.classList.add('active');
            if(id === 'start-screen' || id === 'frame-select-screen') stopCamera();
            if(id === 'frame-select-screen') renderFrameGrid();
        }

        function moveToStart() { showScreen('start-screen'); }
        function goToFrameSelect() { showScreen('frame-select-screen'); }
        function goToShooting() { showScreen('shooting-screen'); initCamera(); }
        function backToFrameSelect() { stopCamera(); showScreen('frame-select-screen'); }
        function retakePhoto() { showScreen('shooting-screen'); }

        function checkPasscode() {
            const pass = prompt("管理者コードを入力してください");
            if(pass === CONFIG.ADMIN_PASSCODE) showScreen('admin-screen');
        }

        document.getElementById('upload-input').onchange = function(e) {
            const files = e.target.files;
            for(let f of files) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    frames.push(ev.target.result);
                    localStorage.setItem('wedding_frames', JSON.stringify(frames));
                    renderAdminPreview();
                };
                reader.readAsDataURL(f);
            }
        };

        function renderAdminPreview() {
            const div = document.getElementById('admin-frame-preview');
            div.innerHTML = frames.map((f, i) => `
                <div style="position:relative; border:1px solid #ddd; padding:5px; background:#fff; border-radius:5px;">
                    <img src="${f}" width="60" height="80" style="object-fit:contain; display:block;">
                    <button onclick="deleteFrame(${i})" style="position:absolute; top:-5px; right:-5px; background:red; color:white; border:none; cursor:pointer; width:24px; height:24px; border-radius:50%; font-weight:bold;">×</button>
                </div>
            `).join('');
        }

        function deleteFrame(i) {
            if(confirm('このフレームを削除しますか？')) {
                frames.splice(i, 1);
                localStorage.setItem('wedding_frames', JSON.stringify(frames));
                renderAdminPreview();
            }
        }

        function renderFrameGrid() {
            const grid = document.getElementById('frame-grid');
            let html = `<div class="frame-item" onclick="selectFrame(this, null)">フレームなし</div>`;
            html += frames.map((f, i) => `
                <div class="frame-item" onclick="selectFrame(this, '${f}')">
                    <img src="${f}">
                </div>
            `).join('');
            grid.innerHTML = html;
            selectedFrame = null;
            document.getElementById('to-shoot-btn').disabled = true;
        }

        function selectFrame(el, src) {
            document.querySelectorAll('.frame-item').forEach(i => i.classList.remove('selected'));
            el.classList.add('selected');
            selectedFrame = src;
            document.getElementById('frame-overlay').src = src || "";
            document.getElementById('to-shoot-btn').disabled = false;
        }

        // 159行目付近の constraints を修正
async function initCamera() {
    try {
        if(stream) stopCamera();
        
        const constraints = {
            video: {
                facingMode: 'user',
                // 縦持ち（Portrait）なので、幅を狭く、高さを長く指定する
                width: { ideal: 1080 }, 
                height: { ideal: 1440 },
                aspectRatio: { ideal: 0.75 } // 3:4 (縦長) を明確に要求
            }
        };
        
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        const video = document.getElementById('webcam');
        video.srcObject = stream;

        // 【追加】映像が読み込まれたら、実際のサイズを元に計算を行う
        video.onloadedmetadata = () => {
            video.play();
            console.log("実際の映像解像度:", video.videoWidth, "x", video.videoHeight);
        };
    } catch(e) {
        alert("カメラの起動に失敗しました。設定を確認してください。");
    }
}
        function stopCamera() {
            if(stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
        }

        function startTimer() {
            document.getElementById('shutter-btn').disabled = true;
            const cd = document.getElementById('countdown');
            let count = 3;
            cd.innerText = count;
            
            const timer = setInterval(() => {
                count--;
                if(count > 0) {
                    cd.innerText = count;
                } else {
                    clearInterval(timer);
                    cd.innerText = "";
                    capture();
                    document.getElementById('shutter-btn').disabled = false;
                }
            }, 1000);
        }

       // 189行目付近の capture() を丸ごと差し替え
function capture() {
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('result-canvas');
    const ctx = canvas.getContext('2d');
    
    // 出力サイズは 3:4 の 1080x1440 に固定
    canvas.width = 1080;
    canvas.height = 1440;
    
    const vW = video.videoWidth;
    const vH = video.videoHeight;
    
    // キャンバスの比率 (0.75) に対して、実際の映像がどうなのかを判定
    const targetRatio = canvas.width / canvas.height;
    const videoRatio = vW / vH;
    
    let sx, sy, sw, sh;

    if (videoRatio > targetRatio) {
        // 映像が横に長すぎる場合（左右をカットして高さを合わせる）
        sw = vH * targetRatio;
        sh = vH;
        sx = (vW - sw) / 2;
        sy = 0;
    } else {
        // 映像が縦に長すぎる場合（上下をカットして幅を合わせる）
        sw = vW;
        sh = vW / targetRatio;
        sx = 0;
        sy = (vH - sh) / 2;
    }

    ctx.save();
    // 鏡像（左右反転）
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    
    // 【重要】drawImageで sx, sy, sw, sh を使って「映像の真ん中」を「キャンバス全体」に描く
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    ctx.restore();
    
    // フレームを重ねる
    if (selectedFrame) {
        const img = new Image();
        img.onload = () => {
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            showScreen('preview-screen');
        };
        img.src = selectedFrame;
    } else { 
        showScreen('preview-screen'); 
    }
}

        function printTwoCopies() {
            const dataUrl = document.getElementById('result-canvas').toDataURL('image/png');
            const win = window.open('', '_blank');
            win.document.write(`
                <html>
                <head>
                    <title>Print Photo</title>
                    <style>
                        body { margin: 0; padding: 20px; }
                        .photo { width: 100%; height: 45%; object-fit: contain; display: block; page-break-after: avoid; }
                        .divider { border-top: 1px dashed #ccc; margin: 10px 0; }
                    </style>
                </head>
                <body>
                    <img src="${dataUrl}" class="photo">
                    <div class="divider"></div>
                    <img src="${dataUrl}" class="photo">
                    <script>
                        window.onload = () => { 
                            setTimeout(() => { window.print(); window.close(); }, 500); 
                        };
                    </` + `script>
                </body>
                </html>
            `);
            win.document.close();
            setTimeout(() => {
                stopCamera();
                showScreen('start-screen');
            }, 1500);
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderAdminPreview();
        });
    </script>
</body>
</html>
