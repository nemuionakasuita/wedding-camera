<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding Photo Booth Premium</title>
    <style>
        :root {
            --primary-pink: #fce4ec;
            --accent-pink: #ff6b9d;
            --admin-bg: #f5f5f5;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
            background-color: #000;
        }

        /* 画面共通設定 */
        .screen {
            position: absolute; width: 100%; height: 100%;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            background-color: white; z-index: 10;
        }

        .active { display: flex !important; }

        /* 横向き警告画面 */
        #landscape-warning {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        #landscape-warning.show {
            display: flex !important;
        }

        .rotate-icon {
            font-size: 8rem;
            margin-bottom: 30px;
            animation: rotate-animation 2s ease-in-out infinite;
        }

        @keyframes rotate-animation {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }

        .warning-text {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .warning-subtext {
            font-size: 1.5rem;
            color: #ccc;
        }

        /* 1. 管理者画面 */
        #admin-screen { background-color: var(--admin-bg); overflow-y: auto; padding: 40px; }
        .admin-card { 
            background: white; padding: 30px; border-radius: 15px; 
            width: 90%; max-width: 600px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            text-align: center; 
        }
        
        .admin-info {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            font-size: 14px;
            color: #856404;
        }
        
        /* 2. スタート画面 */
        #start-screen { background: #000; }
        #guide-video { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; opacity: 0.6; 
        }
        .start-ui { z-index: 20; text-align: center; color: white; }
        
        /* 管理者ボタン */
        .admin-trigger {
            position: absolute; bottom: 20px; left: 20px; 
            width: 60px; height: 60px;
            background: rgba(255, 255, 255, 0.2); 
            border-radius: 50%; z-index: 100;
            cursor: pointer; 
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: rgba(255, 255, 255, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .admin-trigger::after { content: "⚙️"; }

        /* 3. フレーム選択画面 */
        .frame-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 15px; padding: 20px; 
            width: 90%; max-height: 60vh; 
            overflow-y: auto; 
        }
        
        .frame-item { 
            border: 4px solid #eee; 
            border-radius: 10px; 
            cursor: pointer; 
            background: #fff; 
            aspect-ratio: 3/4;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 0.9rem; 
            color: #999; 
            text-align: center;
            overflow: hidden;
        }
        
        .frame-item.selected { 
            border-color: var(--accent-pink); 
            background: #fff0f5; 
        }
        
        .frame-item img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
        }

        /* 4. 撮影画面 */
        .camera-box { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* カメラビューポート（縦長固定） */
        .camera-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        
        #webcam { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transform: scaleX(-1);
        }
        
        #frame-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            pointer-events: none; 
            z-index: 15;
            transform: scaleX(-1);
        }
        
        #countdown { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            font-size: 15rem; 
            color: white; 
            z-index: 20; 
            font-weight: bold; 
            text-shadow: 0 0 30px rgba(0,0,0,0.5); 
        }

        /* 共通ボタン */
        .btn {
            padding: 18px 50px; 
            font-size: 1.6rem; 
            border: none; 
            border-radius: 60px;
            cursor: pointer; 
            background: var(--accent-pink); 
            color: white; 
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            margin: 10px; 
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .btn-back { background: #888; font-size: 1.2rem; padding: 12px 30px; }
        
        /* デバッグ情報 */
        .debug-info {
            position: absolute;
            top: 80px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 11px;
            font-family: monospace;
            z-index: 100;
            display: none;
            text-align: left;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- 横向き警告画面 -->
    <div id="landscape-warning">
        <div class="rotate-icon">📱</div>
        <div class="warning-text">iPadを縦向きにしてください</div>
        <div class="warning-subtext">Please rotate to portrait mode</div>
    </div>

    <div id="admin-screen" class="screen active">
        <div class="admin-card">
            <h2>⚙️ 管理者設定</h2>
            
            <div class="admin-info">
                <strong>📐 フレーム画像の推奨仕様</strong><br>
                サイズ: <strong>1080×1440px</strong> (縦長 3:4)<br>
                形式: PNG（透過背景推奨）<br>
                向き: 縦長（iPadと同じ向き）
            </div>
            
            <input type="file" id="upload-input" multiple accept="image/png,image/jpeg" style="margin:20px 0;">
            <div id="admin-frame-preview" style="display:flex; gap:10px; margin: 20px 0; flex-wrap: wrap; justify-content: center;"></div>
            
            <button class="btn" onclick="moveToStart()">設定完了 → スタート画面へ</button>
        </div>
    </div>

    <div id="start-screen" class="screen">
        <video id="guide-video" autoplay muted loop playsinline>
            <source src="guide.mp4" type="video/mp4">
        </video>
        <div class="start-ui">
            <h1 style="font-size: 4.5rem; margin-bottom: 30px;">Happy Wedding</h1>
            <button class="btn" onclick="goToFrameSelect()">START</button>
        </div>
        <div class="admin-trigger" onclick="checkPasscode()"></div>
    </div>

    <div id="frame-select-screen" class="screen">
        <h2 style="color: var(--accent-pink); font-size: 2.5rem;">フレームを選んでね</h2>
        <div class="frame-grid" id="frame-grid"></div>
        <div style="margin-top: 30px; display: flex; gap: 20px;">
            <button class="btn btn-back" onclick="showScreen('start-screen')">戻る</button>
            <button class="btn" id="to-shoot-btn" onclick="goToShooting()" disabled>撮影にすすむ</button>
        </div>
    </div>

    <div id="shooting-screen" class="screen">
        <div class="camera-box">
            <!-- デバッグ情報 -->
            <div class="debug-info" id="debug-info"></div>
            
            <button class="btn btn-back" style="position:absolute; top:20px; left:20px; z-index:40;" onclick="backToFrameSelect()">戻る</button>
            
            <div class="camera-viewport">
                <video id="webcam" autoplay playsinline muted></video>
                <img id="frame-overlay" src="">
                <div id="countdown"></div>
            </div>
        </div>
        <button class="btn" id="shutter-btn" style="position:absolute; bottom:50px; z-index:30;" onclick="startTimer()">撮影！</button>
    </div>

    <div id="preview-screen" class="screen">
        <canvas id="result-canvas" style="max-width: 85%; max-height: 75%; border-radius: 15px;"></canvas>
        <div style="margin-top: 25px;">
            <button class="btn btn-back" onclick="retakePhoto()">撮り直す</button>
            <button class="btn" onclick="printTwoCopies()">印刷する</button>
        </div>
    </div>

    <script>
        // ========================================
        // 📌 設定
        // ========================================
        const CONFIG = {
            // 管理者パスコード
            ADMIN_PASSCODE: "1234",
            
            // デバッグモード（開発時はtrueに）
            DEBUG_MODE: false
        };

        // ========================================
        // 📱 画面向き検知
        // ========================================
        function checkOrientation() {
            const warning = document.getElementById('landscape-warning');
            
            // 横向きの場合
            if (window.innerWidth > window.innerHeight) {
                warning.classList.add('show');
            } else {
                warning.classList.remove('show');
            }
        }

        // 画面向き変更を監視
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);
        
        // 初回チェック
        checkOrientation();

        // ========================================
        // 📌 グローバル変数
        // ========================================
        let frames = [];
        try {
            const saved = localStorage.getItem('wedding_frames');
            frames = saved ? JSON.parse(saved) : [];
        } catch(e) { 
            console.error('フレーム読み込みエラー:', e);
            frames = []; 
        }

        let selectedFrame = null;
        let stream = null;

        // ========================================
        // 🖥️ 画面遷移
        // ========================================
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(id);
            if(target) target.classList.add('active');

            // カメラ停止条件
            if(id === 'start-screen' || id === 'frame-select-screen') {
                stopCamera();
            }
            
            // フレームグリッド再描画
            if(id === 'frame-select-screen') {
                renderFrameGrid();
            }
        }

        function moveToStart() { showScreen('start-screen'); }
        function goToFrameSelect() { showScreen('frame-select-screen'); }
        function goToShooting() { 
            showScreen('shooting-screen'); 
            initCamera(); 
        }
        
        function backToFrameSelect() {
            stopCamera();
            showScreen('frame-select-screen');
        }
        
        function retakePhoto() {
            showScreen('shooting-screen');
        }

        // ========================================
        // 🎨 管理者画面
        // ========================================
        function checkPasscode() {
            const pass = prompt("管理者コードを入力してください");
            if(pass === CONFIG.ADMIN_PASSCODE) {
                showScreen('admin-screen');
            }
        }

        document.getElementById('upload-input').onchange = function(e) {
            const files = e.target.files;
            for(let f of files) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    frames.push(ev.target.result);
                    localStorage.setItem('wedding_frames', JSON.stringify(frames));
                    renderAdminPreview();
                };
                reader.readAsDataURL(f);
            }
        };

        function renderAdminPreview() {
            const div = document.getElementById('admin-frame-preview');
            div.innerHTML = frames.map((f, i) => `
                <div style="position:relative; border:1px solid #ddd; padding:5px; background:#fff; border-radius:5px;">
                    <img src="${f}" width="60" height="80" style="object-fit:contain; display:block;">
                    <button onclick="deleteFrame(${i})" style="position:absolute; top:-5px; right:-5px; background:red; color:white; border:none; cursor:pointer; width:24px; height:24px; border-radius:50%; font-weight:bold;">×</button>
                </div>
            `).join('');
        }

        function deleteFrame(i) {
            if(confirm('このフレームを削除しますか？')) {
                frames.splice(i, 1);
                localStorage.setItem('wedding_frames', JSON.stringify(frames));
                renderAdminPreview();
            }
        }

        // ========================================
        // 🖼️ フレーム選択
        // ========================================
        function renderFrameGrid() {
            const grid = document.getElementById('frame-grid');
            let html = `<div class="frame-item" onclick="selectFrame(this, null)">フレームなし</div>`;
            html += frames.map((f, i) => `
                <div class="frame-item" onclick="selectFrame(this, '${f}')">
                    <img src="${f}">
                </div>
            `).join('');
            grid.innerHTML = html;
            
            selectedFrame = null;
            document.getElementById('to-shoot-btn').disabled = true;
        }

        function selectFrame(el, src) {
            document.querySelectorAll('.frame-item').forEach(i => i.classList.remove('selected'));
            el.classList.add('selected');
            selectedFrame = src;
            
            const overlay = document.getElementById('frame-overlay');
            overlay.src = src || "";
            
            document.getElementById('to-shoot-btn').disabled = false;
        }

        // ========================================
        // 📷 カメラ制御（縦向き固定）
        // ========================================
        async function initCamera() {
            try {
                if(stream) stopCamera();
                
                // 縦向き専用の設定
                const constraints = {
                    video: {
                        facingMode: 'user',
                        // 解像度は指定せず、デバイスのデフォルトを使用
                        aspectRatio: { ideal: 0.75 }  // 3:4を推奨
                    }
                };
                
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                const video = document.getElementById('webcam');
                video.srcObject = stream;
                
                // カメラ起動完了を待つ
                await new Promise((resolve, reject) => {
                    video.onloadedmetadata = () => {
                        video.play()
                            .then(() => {
                                console.log(`✅ カメラ起動: ${video.videoWidth}×${video.videoHeight}`);
                                
                                // デバッグ情報表示
                                if(CONFIG.DEBUG_MODE) {
                                    const debugInfo = document.getElementById('debug-info');
                                    debugInfo.style.display = 'block';
                                    const aspectRatio = (video.videoWidth / video.videoHeight).toFixed(3);
                                    debugInfo.innerHTML = `
                                        解像度: ${video.videoWidth}×${video.videoHeight}<br>
                                        アスペクト比: ${aspectRatio}<br>
                                        向き: ${video.videoWidth < video.videoHeight ? '縦' : '横'}
                                    `;
                                }
                                
                                resolve();
                            })
                            .catch(reject);
                    };
                    
                    setTimeout(() => {
                        reject(new Error('カメラ起動タイムアウト'));
                    }, 10000);
                });
                
            } catch(e) {
                console.error('カメラエラー:', e);
                alert("カメラの起動に失敗しました。\n\nカメラの許可を確認してください。");
            }
        }

        function stopCamera() {
            if(stream) { 
                stream.getTracks().forEach(t => t.stop()); 
                stream = null; 
                console.log('🛑 カメラ停止');
            }
        }

        // ========================================
        // 📸 撮影処理（縦長固定版）
        // ========================================
        function startTimer() {
            document.getElementById('shutter-btn').disabled = true;
            const cd = document.getElementById('countdown');
            let count = 3;
            cd.innerText = count;
            
            const timer = setInterval(() => {
                count--;
                if(count > 0) {
                    cd.innerText = count;
                } else {
                    clearInterval(timer);
                    cd.innerText = "";
                    capture();
                    document.getElementById('shutter-btn').disabled = false;
                }
            }, 1000);
        }

        function capture() {
            const video = document.getElementById('webcam');
            const canvas = document.getElementById('result-canvas');
            const ctx = canvas.getContext('2d');
            
            // ビデオの実際のサイズを取得
            let vw = video.videoWidth;
            let vh = video.videoHeight;
            
            // 強制的に縦長に修正
            // もしvideoWidthの方が大きければ、幅と高さを入れ替える
            if (vw > vh) {
                // 横長になっている場合は入れ替え
                [vw, vh] = [vh, vw];
                console.log(`⚠️ 解像度を入れ替え: ${video.videoWidth}×${video.videoHeight} → ${vw}×${vh}`);
            }
            
            // キャンバスを縦長に設定
            canvas.width = vw;
            canvas.height = vh;
            
            console.log(`📸 撮影サイズ: ${canvas.width}×${canvas.height}`);
            
            // 反転を元に戻して描画
            ctx.save();
            
            // ビデオが横長だった場合は90度回転させて縦長に
            if (video.videoWidth > video.videoHeight) {
                // 90度回転 + 反転
                ctx.translate(canvas.width, 0);
                ctx.rotate(90 * Math.PI / 180);
                ctx.scale(-1, 1);
                ctx.drawImage(video, -canvas.height, 0, canvas.height, canvas.width);
            } else {
                // 通常の反転のみ
                ctx.scale(-1, 1);
                ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
            }
            
            ctx.restore();
            
            // フレーム画像を重ねる
            if (selectedFrame) {
                const img = new Image();
                img.onload = () => {
                    ctx.save();
                    
                    // フレームも同様の処理
                    if (video.videoWidth > video.videoHeight) {
                        ctx.translate(canvas.width, 0);
                        ctx.rotate(90 * Math.PI / 180);
                        ctx.scale(-1, 1);
                        ctx.drawImage(img, -canvas.height, 0, canvas.height, canvas.width);
                    } else {
                        ctx.scale(-1, 1);
                        ctx.drawImage(img, -canvas.width, 0, canvas.width, canvas.height);
                    }
                    
                    ctx.restore();
                    showScreen('preview-screen');
                };
                img.src = selectedFrame;
            } else { 
                showScreen('preview-screen'); 
            }
        }

        // ========================================
        // 🖨️ 印刷処理
        // ========================================
        function printTwoCopies() {
            const dataUrl = document.getElementById('result-canvas').toDataURL('image/png');
            const win = window.open('', '_blank');
            win.document.write(`
                <html>
                <head>
                    <title>Print Photo</title>
                    <style>
                        body { margin: 0; padding: 20px; }
                        .photo { 
                            width: 100%; 
                            height: 45%; 
                            object-fit: contain; 
                            display: block;
                            page-break-after: avoid;
                        }
                        .divider { 
                            border-top: 1px dashed #ccc; 
                            margin: 10px 0; 
                        }
                    </style>
                </head>
                <body>
                    <img src="${dataUrl}" class="photo">
                    <div class="divider"></div>
                    <img src="${dataUrl}" class="photo">
                    <script>
                        window.onload = () => { 
                            setTimeout(() => { 
                                window.print(); 
                                window.close(); 
                            }, 500); 
                        };
                    </` + `script>
                </body>
                </html>
            `);
            win.document.close();
            
            // 印刷後、スタート画面に戻る
            setTimeout(() => {
                stopCamera();
                showScreen('start-screen');
            }, 1500);
        }

        // ========================================
        // 🚀 初期化
        // ========================================
        window.addEventListener('DOMContentLoaded', () => {
            renderAdminPreview();
            console.log('Wedding Photo Booth 起動完了（縦向き専用）');
        });
    </script>
</body>
</html>
